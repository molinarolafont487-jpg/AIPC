[project]
name = "phantom-api"
version = "0.1.0"
description = "FastAPI backend for Phantom AI Workstation MVP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "python-jose[cryptography]>=3.3.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  "redis>=5.2.0",
  "httpx>=0.27.2"
]

[tool.ruff]
line-length = 88
